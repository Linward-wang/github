<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>霓虹突围 NEON RUSH</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#050510; touch-action:none;
    -webkit-user-select:none; user-select:none; font-family:'Segoe UI',system-ui,sans-serif; }
  #game { display:block; position:fixed; inset:0; }
  .hud { position:fixed; pointer-events:none; color:#aef; text-shadow:0 0 8px #0ff,0 0 20px #0ff8;
    font-weight:700; z-index:10; }
  #score { top:14px; left:16px; font-size:26px; letter-spacing:2px; }
  #best  { top:44px; left:16px; font-size:13px; opacity:.7; }
  #combo { top:14px; right:16px; font-size:20px; color:#ffd94a; text-shadow:0 0 10px #fa0,0 0 25px #f80;
    transition:transform .1s; }
  #wave  { top:44px; right:16px; font-size:13px; opacity:.8; }
  #dashWrap { bottom:18px; right:16px; width:120px; height:10px; border:1px solid #0ff8;
    border-radius:6px; overflow:hidden; background:#0ff1; }
  #dashBar { height:100%; width:100%; background:linear-gradient(90deg,#0ff,#0af); box-shadow:0 0 10px #0ff; transition:width .05s linear; }
  #dashTip { bottom:32px; right:16px; font-size:12px; opacity:.7; }
  #pauseBtn { position:fixed; top:12px; right:50%; transform:translateX(50%); pointer-events:auto;
    background:transparent; border:1px solid #0ff5; color:#aef; border-radius:8px; padding:6px 16px;
    font-size:14px; cursor:pointer; z-index:20; text-shadow:0 0 8px #0ff; }
  #pauseBtn:hover { background:#0ff2; }
  .overlay { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center;
    justify-content:center; background:radial-gradient(ellipse at center,#0ff1,#050510cc 70%);
    z-index:30; color:#dff; text-align:center; transition:opacity .3s; }
  .overlay h1 { font-size:clamp(38px,9vw,84px); letter-spacing:8px; margin-bottom:6px;
    color:#fff; text-shadow:0 0 10px #0ff,0 0 40px #0ff,0 0 80px #08f; animation:pulse 2s infinite; }
  @keyframes pulse { 50% { text-shadow:0 0 20px #f0f,0 0 60px #f0f,0 0 100px #a0f; } }
  .overlay p { font-size:16px; line-height:1.9; opacity:.85; max-width:520px; padding:0 20px; }
  .btn { margin-top:28px; pointer-events:auto; background:linear-gradient(180deg,#0ff3,#08f3);
    border:1px solid #0ff; color:#fff; font-size:22px; font-weight:800; letter-spacing:4px;
    padding:16px 60px; border-radius:40px; cursor:pointer; box-shadow:0 0 25px #0ff6;
    text-shadow:0 0 10px #0ff; transition:transform .15s, box-shadow .15s; }
  .btn:hover { transform:scale(1.07); box-shadow:0 0 45px #0ffb; }
  #finalScore { font-size:34px; color:#ffd94a; text-shadow:0 0 15px #fa0; margin-top:10px; }
  #newRecord { color:#ff5da2; font-size:18px; text-shadow:0 0 12px #f4a; display:none; margin-top:6px;
    animation:pulse 1s infinite; }
  .hidden { opacity:0; pointer-events:none; }
  #muteBtn { position:fixed; bottom:14px; left:16px; z-index:20; background:transparent; border:none;
    font-size:24px; cursor:pointer; filter:drop-shadow(0 0 6px #0ff); }
  #hint { position:fixed; bottom:14px; left:50%; transform:translateX(-50%); color:#8ef; font-size:13px;
    opacity:.6; pointer-events:none; z-index:10; text-shadow:0 0 6px #0ff; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="score" class="hud">0</div>
<div id="best" class="hud">BEST 0</div>
<div id="combo" class="hud"></div>
<div id="wave" class="hud"></div>
<div id="dashTip" class="hud">冲刺</div>
<div id="dashWrap" class="hud"><div id="dashBar"></div></div>
<button id="pauseBtn">‖ 暂停</button>
<button id="muteBtn">🔊</button>
<div id="hint">🖱️ 移动 / 空格冲刺 · 📱 滑动移动 / 双击冲刺</div>

<div id="startScreen" class="overlay">
  <h1>霓虹突围</h1>
  <p>移动收集 ⚡ 能量水晶，躲开红色威胁体。<br>
  🔵 冲刺可短暂无敌 &nbsp;·&nbsp; 🛡️ 护盾 &nbsp;·&nbsp; 🧲 磁吸 &nbsp;·&nbsp; ⏳ 时间减缓<br>
  连续拾取可叠加 <b style="color:#ffd94a">COMBO 倍率</b>，失误清零！撑得越久，世界越疯狂。</p>
  <button class="btn" id="startBtn">开 始</button>
  <p style="margin-top:18px;font-size:13px;opacity:.6">本地最高分会被记录，刷新不丢分</p>
</div>
<div id="overScreen" class="overlay hidden">
  <h1 style="font-size:clamp(30px,7vw,60px)">GAME OVER</h1>
  <div id="finalScore">0</div>
  <div id="newRecord">🏆 新纪录！</div>
  <p id="overStats"></p>
  <button class="btn" id="retryBtn">再 来 一 局</button>
</div>
<div id="pauseScreen" class="overlay hidden">
  <h1 style="font-size:40px">已暂停</h1>
  <button class="btn" id="resumeBtn">继 续</button>
</div>

<script>
(() => {
'use strict';
const cv = document.getElementById('game'), ctx = cv.getContext('2d');
let W, H, DPR = Math.min(devicePixelRatio || 1, 2);
function resize(){ W = innerWidth; H = innerHeight; cv.width = W*DPR; cv.height = H*DPR;
  cv.style.width = W+'px'; cv.style.height = H+'px'; ctx.setTransform(DPR,0,0,DPR,0,0); }
addEventListener('resize', resize); resize();

// ---------- 工具 ----------
const rand = (a,b)=>a+Math.random()*(b-a);
const clamp = (v,a,b)=>v<a?a:v>b?b:v;
const dist = (x1,y1,x2,y2)=>Math.hypot(x1-x2,y1-y2);
const lerp = (a,b,t)=>a+(b-a)*t;

// ---------- 音效 (WebAudio 合成，无外部文件) ----------
let AC = null, muted = false;
function audio(){ if(!AC) AC = new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume(); }
function beep(f, d, type='sine', vol=.15, slide=0){
  if(muted || !AC) return;
  const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
  o.type = type; o.frequency.setValueAtTime(f,t);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide), t+d);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001, t+d);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t+d);
}
const sfx = {
  gem : c => beep(500+c*120, .12, 'square', .1, 300),
  dash: () => beep(200, .25, 'sawtooth', .12, 500),
  hit : () => { beep(150, .4, 'sawtooth', .2, -100); beep(80, .5, 'square', .15, -40); },
  pow : () => beep(300, .3, 'triangle', .15, 400),
  over: () => { beep(300,.15,'square',.15,-150); setTimeout(()=>beep(200,.2,'square',.15,-120),150); setTimeout(()=>beep(120,.5,'square',.15,-80),320); }
};
document.getElementById('muteBtn').onclick = e => { muted = !muted; e.target.textContent = muted ? '🔇' : '🔊'; };

// ---------- 游戏状态 ----------
const S = { MENU:0, PLAY:1, OVER:2, PAUSE:3 };
let state = S.MENU;
let score=0, combo=0, best=+(localStorage.getItem('neon_best')||0), comboTimer=0;
let wave=0, waveTimer=0, gameTime=0, spawnTimer=0, powTimer=6;
let shake=0, slowmo=0, magnet=0, shield=false;
let hue = 190;

const player = { x:0, y:0, r:8, vx:0, vy:0, speed:.16, dashCd:0, dashT:0, trail:[] };
let enemies=[], gems=[], particles=[], powers=[], texts=[];

const keys = {};
addEventListener('keydown', e => {
  keys[e.code]=true;
  if(e.code==='Space'){ e.preventDefault();
    if(state===S.PLAY) dash(); else if(state===S.MENU) start(); else if(state===S.OVER) start(); }
  if(e.code==='KeyP' && state===S.PLAY) pause();
});
addEventListener('keyup', e => keys[e.code]=false);

let mouse = {x:0,y:0,active:false};
addEventListener('mousemove', e => { mouse.x=e.clientX; mouse.y=e.clientY; mouse.active=true; });

// 触摸控制：单指滑动移动，双击冲刺
let touches = new Map(), lastTap=0;
cv.addEventListener('touchstart', e => {
  e.preventDefault(); audio();
  for(const t of e.changedTouches){ touches.set(t.identifier, {x:t.clientX, y:t.clientY});
    const now = performance.now();
    if(now - lastTap < 280) dash();
    lastTap = now;
  }
  if(state===S.MENU||state===S.OVER) start();
},{passive:false});
cv.addEventListener('touchmove', e => { e.preventDefault();
  for(const t of e.changedTouches){ const p=touches.get(t.identifier);
    if(p){ p.x=t.clientX; p.y=t.clientY; } }
},{passive:false});
cv.addEventListener('touchend', e => { for(const t of e.changedTouches) touches.delete(t.identifier); });

cv.addEventListener('mousedown', () => { audio(); if(state===S.PLAY) dash();
  else if(state===S.MENU||state===S.OVER) start(); });

document.getElementById('startBtn').onclick = () => { audio(); start(); };
document.getElementById('retryBtn').onclick = () => { audio(); start(); };
document.getElementById('resumeBtn').onclick = () => { if(state===S.PAUSE){ state=S.PLAY; show('pauseScreen',false); } };
document.getElementById('pauseBtn').onclick = () => { if(state===S.PLAY) pause(); };
function pause(){ state=S.PAUSE; show('pauseScreen',true); }
function show(id,on){ document.getElementById(id).classList.toggle('hidden', !on); }

// ---------- 逻辑 ----------
function start(){
  score=0; combo=0; wave=0; gameTime=0; waveTimer=0; spawnTimer=.5; powTimer=rand(5,9);
  slowmo=0; magnet=0; shield=false; shake=0; hue=190;
  player.x=W/2; player.y=H/2; player.vx=player.vy=0; player.dashCd=0; player.dashT=0; player.trail.length=0;
  enemies.length=0; gems.length=0; particles.length=0; powers.length=0; texts.length=0;
  show('startScreen',false); show('overScreen',false); show('pauseScreen',false);
  state=S.PLAY;
  beep(440,.15,'triangle',.15,220);
}
function dash(){
  if(player.dashCd>0) return;
  player.dashCd=1.6; player.dashT=.25; sfx.dash(); shake=6;
  for(let i=0;i<14;i++) particles.push({x:player.x,y:player.y,vx:rand(-3,3),vy:rand(-3,3),life:1,sz:rand(2,5),col:'#0ff'});
}
function addText(x,y,txt,col='#ffd94a'){ texts.push({x,y,txt,life:1,col}); }
function burst(x,y,col,n=20,sp=4){ for(let i=0;i<n;i++){ const a=rand(0,Math.PI*2), s=rand(1,sp);
  particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,sz:rand(2,6),col}); } }

function spawnEnemy(){
  const edge = Math.floor(rand(0,4));
  let x,y; const m=30;
  if(edge===0){x=rand(0,W);y=-m;} else if(edge===1){x=W+m;y=rand(0,H);}
  else if(edge===2){x=rand(0,W);y=H+m;} else {x=-m;y=rand(0,H);}
  const spd = rand(.6,1.2) + wave*.08;
  // 三种敌人：追踪者 / 直线冲刺者 / 变速幽灵
  const type = Math.random();
  enemies.push({ x,y, r: rand(7,13), type: type<.55?0 : type<.85?1:2,
    spd, ang: Math.atan2(player.y-y, player.x-x), turn: type<.55? .02+wave*.002 : 0,
    wob: rand(0,10), col: type<.55?'#ff3355': type<.85?'#ff8833':'#cc44ff' });
}
function spawnGem(){
  const x=rand(50,W-50), y=rand(60,H-60);
  gems.push({x,y,r:6,val:10,wob:rand(0,6)});
}
function spawnPower(){
  const x=rand(60,W-60), y=rand(80,H-80);
  const kinds=[['shield','🛡'],['magnet','🧲'],['slow','⏳']];
  const [kind,ico]=kinds[Math.floor(rand(0,3))];
  powers.push({x,y,kind,ico,life:9,wob:0});
}
function gameOver(){
  state=S.OVER; sfx.over(); shake=16;
  burst(player.x,player.y,'#0ff',50,7); burst(player.x,player.y,'#fff',30,5);
  const isNew = score>best;
  if(isNew){ best=score; localStorage.setItem('neon_best', best); }
  document.getElementById('finalScore').textContent = '得分 ' + score;
  document.getElementById('newRecord').style.display = isNew?'block':'none';
  document.getElementById('overStats').innerHTML =
    `坚持了 <b>${gameTime.toFixed(1)}s</b> · 到达 <b>第 ${wave} 波</b> · 最高连击 <b>x${maxCombo}</b>`;
  setTimeout(()=>show('overScreen',true), 600);
}

// ---------- 更新 ----------
let lastT = performance.now(), maxCombo = 0;
function loop(now){
  requestAnimationFrame(loop);
  let dt = Math.min((now-lastT)/1000, .05); lastT = now;
  if(state===S.PLAY) update(dt);
  render();
}
requestAnimationFrame(loop);

function update(dt){
  gameTime += dt;
  const ts = slowmo>0 ? .35 : 1;   // 时间减缓全局倍率
  const dtp = dt*ts;

  hue = (hue + dt*4) % 360;   // 世界随时间变色
  if(slowmo>0) slowmo-=dt;
  if(magnet>0) magnet-=dt;
  if(player.dashCd>0) player.dashCd-=dt;
  if(player.dashT>0) player.dashT-=dt;
  if(shake>0) shake=Math.max(0,shake-dt*30);
  if(comboTimer>0){ comboTimer-=dt; if(comboTimer<=0) combo=0; }
  maxCombo = Math.max(maxCombo, combo);

  // ---- 波次 ----
  waveTimer += dt;
  if(waveTimer >= 10){ waveTimer=0; wave++;
    addText(W/2, H*.35, `⚠ 第 ${wave+1} 波来袭`, '#ff5da2');
    beep(600,.2,'square',.12,-200);
    for(let i=0;i<3+wave;i++) spawnEnemy();
  }

  // ---- 生成 ----
  spawnTimer -= dt;
  if(spawnTimer<=0){ spawnTimer = clamp(1.1 - wave*.09, .18, 1.1)*rand(.6,1.2); spawnEnemy(); }
  powTimer -= dt;
  if(powTimer<=0){ powTimer=rand(8,13); spawnPower(); }
  if(gems.length<6 && Math.random()<dt*1.5) spawnGem();

  // ---- 玩家移动 ----
  let tx = null, ty = null;
  // 触摸优先
  if(touches.size){ const t=[...touches.values()][0]; tx=t.x; ty=t.y; }
  else if(keys.KeyW||keys.ArrowUp||keys.KeyS||keys.ArrowDown||keys.KeyA||keys.ArrowLeft||keys.KeyD||keys.ArrowRight){
    let dx=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0);
    let dy=(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0);
    const l=Math.hypot(dx,dy)||1;
    player.vx = lerp(player.vx, dx/l*6.2, .15);
    player.vy = lerp(player.vy, dy/l*6.2, .15);
  } else if(mouse.active){
    const dx=mouse.x-player.x, dy=mouse.y-player.y, d=Math.hypot(dx,dy);
    const spd = Math.min(d*.09, 6.5);
    if(d>2){ player.vx=lerp(player.vx, dx/d*spd, .18); player.vy=lerp(player.vy, dy/d*spd, .18); }
    else { player.vx*=.9; player.vy*=.9; }
  } else { player.vx*=.94; player.vy*=.94; }
  if(tx!==null){ const dx=tx-player.x, dy=ty-player.y, d=Math.hypot(dx,dy);
    if(d>3){ player.vx=lerp(player.vx, dx/d*Math.min(d*.1,7), .2); player.vy=lerp(player.vy, dy/d*Math.min(d*.1,7), .2);} }

  player.x = clamp(player.x + player.vx*dtp*60, player.r, W-player.r);
  player.y = clamp(player.y + player.vy*dtp*60, player.r, H-player.r);
  player.trail.push({x:player.x,y:player.y,life:1});
  if(player.trail.length>22) player.trail.shift();
  for(const p of player.trail) p.life-=dt*3;

  // ---- 敌人 ----
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i]; e.wob+=dtp;
    if(e.type===0){ // 追踪者
      const want=Math.atan2(player.y-e.y, player.x-e.x);
      let diff=want-e.ang; while(diff>Math.PI)diff-=Math.PI*2; while(diff<-Math.PI)diff+=Math.PI*2;
      e.ang += clamp(diff,-e.turn,e.turn)*dtp*60;
      e.x+=Math.cos(e.ang)*e.spd*dtp*60; e.y+=Math.sin(e.ang)*e.spd*dtp*60;
    } else if(e.type===1){ // 冲刺者：蓄力-爆发循环
      const c=Math.sin(e.wob*2);
      const s = c>0 ? .35 : e.spd*2.2;
      e.x+=Math.cos(e.ang)*s*dtp*60; e.y+=Math.sin(e.ang)*s*dtp*60;
    } else { // 幽灵：变速 + 正弦漂移
      const s = e.spd*(.6+.6*Math.sin(e.wob*3));
      e.x+=Math.cos(e.ang)*s*dtp*60 + Math.cos(e.wob*2)*.5;
      e.y+=Math.sin(e.ang)*s*dtp*60 + Math.sin(e.wob*1.7)*.5;
    }
    // 出界回收
    if(e.x<-80||e.x>W+80||e.y<-80||e.y>H+80){ enemies.splice(i,1); continue; }
    // 碰撞
    const d=dist(player.x,player.y,e.x,e.y);
    if(player.dashT>0 && d<player.r+e.r+18){ // 冲刺撞碎敌人！
      enemies.splice(i,1);
      const gain = 25*(1+combo*.1)|0;
      score+=gain; burst(e.x,e.y,e.col,16,4); addText(e.x,e.y,'+'+gain);
      beep(300,.1,'square',.1,200);
      continue;
    }
    if(d<player.r+e.r-2){
      if(shield){ shield=false; enemies.splice(i,1); burst(player.x,player.y,'#4af',24,5);
        addText(player.x,player.y-20,'护盾抵挡!','#4af'); sfx.pow(); shake=8; continue; }
      gameOver(); return;
    }
  }

  // ---- 水晶 ----
  for(let i=gems.length-1;i>=0;i--){
    const g=gems[i]; g.wob+=dt;
    const pullR = magnet>0 ? 220 : 0;
    if(pullR){ const d=dist(player.x,player.y,g.x,g.y);
      if(d<pullR){ g.x=lerp(g.x,player.x,.12); g.y=lerp(g.y,player.y,.12); } }
    if(dist(player.x,player.y,g.x,g.y) < player.r+g.r+6){
      gems.splice(i,1);
      combo++; comboTimer=2.5;
      const gain = Math.round(g.val*(1+combo*.15));
      score+=gain;
      addText(g.x,g.y,'+'+gain+(combo>2?` x${combo}`:''));
      sfx.gem(Math.min(combo,10));
      burst(g.x,g.y,'#ffd94a',8,3);
      const el=document.getElementById('combo');
      el.textContent = combo>1?`COMBO x${combo}`:'';
      el.style.transform='scale(1.4)'; setTimeout(()=>el.style.transform='scale(1)',100);
    }
  }

  // ---- 道具 ----
  for(let i=powers.length-1;i>=0;i--){
    const p=powers[i]; p.life-=dt; p.wob+=dt;
    if(p.life<=0){ powers.splice(i,1); continue; }
    if(dist(player.x,player.y,p.x,p.y)<player.r+16){
      powers.splice(i,1); sfx.pow();
      if(p.kind==='shield'){ shield=true; addText(player.x,player.y-24,'🛡️ 护盾!','#4af'); }
      if(p.kind==='magnet'){ magnet=6; addText(player.x,player.y-24,'🧲 磁吸!','#4af'); }
      if(p.kind==='slow'){ slowmo=4; addText(player.x,player.y-24,'⏳ 时间减缓!','#4af'); shake=5; }
      burst(p.x,p.y,'#4af',18,4);
    }
  }

  // ---- 粒子 / 文字 ----
  for(let i=particles.length-1;i>=0;i--){ const p=particles[i];
    p.x+=p.vx*dtp*60; p.y+=p.vy*dtp*60; p.vx*=.96; p.vy*=.96; p.life-=dtp*1.6;
    if(p.life<=0) particles.splice(i,1); }
  for(let i=texts.length-1;i>=0;i--){ const t=texts[i];
    t.y-=dt*40; t.life-=dt*.9; if(t.life<=0) texts.splice(i,1); }

  // HUD
  document.getElementById('score').textContent = score;
  document.getElementById('best').textContent = 'BEST ' + Math.max(best,score);
  document.getElementById('wave').textContent = 'WAVE ' + (wave+1) + ' · ' + gameTime.toFixed(0) + 's';
  document.getElementById('dashBar').style.width = clamp((1-player.dashCd/1.6)*100,0,100)+'%';
  document.getElementById('dashTip').textContent = player.dashCd<=0?'冲刺 READY ⚡':'冲刺冷却中…';
}

// ---------- 渲染 ----------
function render(){
  // 背景
  const g = ctx.createLinearGradient(0,0,W,H);
  g.addColorStop(0,`hsl(${hue},60%,6%)`); g.addColorStop(1,`hsl(${(hue+60)%360},60%,9%)`);
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  // 网格
  ctx.strokeStyle=`hsla(${hue},80%,60%,.07)`; ctx.lineWidth=1;
  const gs=64, off=(gameTime*20)%gs;
  ctx.beginPath();
  for(let x=-off;x<W;x+=gs){ctx.moveTo(x,0);ctx.lineTo(x,H);}
  for(let y=-off;y<H;y+=gs){ctx.moveTo(0,y);ctx.lineTo(W,y);}
  ctx.stroke();

  if(state===S.MENU){ menuBg(); return; }
  ctx.save();
  if(shake>0) ctx.translate(rand(-shake,shake),rand(-shake,shake));

  // 玩家拖尾
  for(const p of player.trail){ if(p.life<=0)continue;
    ctx.globalAlpha=p.life*.5; ctx.fillStyle='#0ff';
    ctx.beginPath(); ctx.arc(p.x,p.y,player.r*p.life*.9,0,7); ctx.fill(); }
  ctx.globalAlpha=1;

  // 冲刺光环
  if(player.dashT>0){ ctx.strokeStyle='#0ff'; ctx.lineWidth=3; ctx.shadowColor='#0ff'; ctx.shadowBlur=20;
    ctx.beginPath(); ctx.arc(player.x,player.y,player.r+14+Math.sin(gameTime*40)*3,0,7); ctx.stroke(); ctx.shadowBlur=0; }

  // 护盾
  if(shield){ ctx.strokeStyle='#4af'; ctx.lineWidth=2; ctx.shadowColor='#4af'; ctx.shadowBlur=15;
    ctx.beginPath(); ctx.arc(player.x,player.y,player.r+10+Math.sin(gameTime*5)*2,0,7); ctx.stroke(); ctx.shadowBlur=0; }

  // 玩家
  ctx.shadowColor='#0ff'; ctx.shadowBlur=25;
  const pg=ctx.createRadialGradient(player.x,player.y,0,player.x,player.y,player.r);
  pg.addColorStop(0,'#fff'); pg.addColorStop(.5,'#0ff'); pg.addColorStop(1,'#08f');
  ctx.fillStyle=pg; ctx.beginPath(); ctx.arc(player.x,player.y,player.r,0,7); ctx.fill();
  ctx.shadowBlur=0;

  // 敌人
  for(const e of enemies){
    ctx.shadowColor=e.col; ctx.shadowBlur=15;
    const rr = e.r + (e.type===1? Math.sin(e.wob*2)*2 : Math.sin(e.wob*4)*1);
    ctx.fillStyle=e.col;
    if(e.type===2){ ctx.globalAlpha=.75; }
    ctx.beginPath();
    if(e.type===1){ // 菱形
      ctx.moveTo(e.x+rr,e.y); ctx.lineTo(e.x,e.y+rr); ctx.lineTo(e.x-rr,e.y); ctx.lineTo(e.x,e.y-rr);
    } else ctx.arc(e.x,e.y,rr,0,7);
    ctx.fill(); ctx.globalAlpha=1; ctx.shadowBlur=0;
    // 冲刺者预警线
    if(e.type===1 && Math.sin(e.wob*2)>0){
      ctx.strokeStyle=e.col+'44'; ctx.setLineDash([4,8]);
      ctx.beginPath(); ctx.moveTo(e.x,e.y);
      ctx.lineTo(e.x+Math.cos(e.ang)*120, e.y+Math.sin(e.ang)*120); ctx.stroke(); ctx.setLineDash([]);
    }
  }

  // 水晶
  for(const gm of gems){
    const s=gm.r+Math.sin(gm.wob*4)*1.5;
    ctx.save(); ctx.translate(gm.x,gm.y); ctx.rotate(gm.wob*2);
    ctx.shadowColor='#ffd94a'; ctx.shadowBlur=15; ctx.fillStyle='#ffd94a';
    ctx.beginPath(); ctx.moveTo(0,-s); ctx.lineTo(s*.7,0); ctx.lineTo(0,s); ctx.lineTo(-s*.7,0);
    ctx.fill(); ctx.restore(); ctx.shadowBlur=0;
  }

  // 道具
  for(const p of powers){
    const bob=Math.sin(p.wob*3)*4;
    ctx.globalAlpha = p.life<2 ? (Math.sin(gameTime*10)>0?1:.3) : 1;
    ctx.fillStyle='#113'; ctx.strokeStyle='#4af'; ctx.lineWidth=2;
    ctx.shadowColor='#4af'; ctx.shadowBlur=14;
    ctx.beginPath(); ctx.arc(p.x,p.y+bob,15,0,7); ctx.fill(); ctx.stroke(); ctx.shadowBlur=0;
    ctx.font='15px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(p.ico,p.x,p.y+bob+1);
    ctx.globalAlpha=1;
  }

  // 粒子
  for(const p of particles){ ctx.globalAlpha=p.life; ctx.fillStyle=p.col;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.sz*p.life,0,7); ctx.fill(); }
  ctx.globalAlpha=1;

  // 文字
  ctx.textAlign='center'; ctx.font='bold 16px sans-serif';
  for(const t of texts){ ctx.globalAlpha=t.life; ctx.fillStyle=t.col;
    ctx.shadowColor=t.col; ctx.shadowBlur=10; ctx.fillText(t.txt,t.x,t.y); ctx.shadowBlur=0; }
  ctx.globalAlpha=1;

  // 慢动作滤镜提示
  if(slowmo>0){ ctx.fillStyle='rgba(70,140,255,.12)'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#4af'; ctx.font='bold 20px sans-serif'; ctx.textAlign='center';
    ctx.fillText('⏳ TIME SLOWED', W/2, 80); }
  ctx.restore();
}

// 菜单背景：漂浮粒子
const stars = Array.from({length:70},()=>({x:rand(0,innerWidth),y:rand(0,innerHeight),s:rand(.3,1.6),v:rand(5,25)}));
function menuBg(){
  const t=performance.now()/1000;
  for(const s of stars){ s.y+=s.v/60; if(s.y>innerHeight){s.y=0;s.x=rand(0,innerWidth);}
    ctx.globalAlpha=.4+.6*Math.sin(t*2+s.x);
    ctx.fillStyle='#0ff'; ctx.beginPath(); ctx.arc(s.x,s.y,s.s,0,7); ctx.fill(); }
  ctx.globalAlpha=1;
}

document.getElementById('best').textContent = 'BEST ' + best;
})();
</script>
